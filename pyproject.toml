[project]
name = "multilingual-course-assistant"
version = "0.1.0"
description = "Multilingual QA over university course materials (RAG, open-weight Qwen)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "django>=5.2,<6",
    "djangorestframework>=3.18.0",
    "docling>=2.117.0",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "openai>=2.53.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2",
    "pypdf>=6.14.2",
    # docling is what actually needs torch; it is named here only so [tool.uv.sources]
    # below can reach it — uv applies sources to direct dependencies only.
    "qdrant-client>=1.18.0",
    "sentence-transformers>=5.6.1",
    "torch>=2.13",
]

[dependency-groups]
dev = [
    # Type-check only. Pylance ships its own Django stubs, so without this the
    # editor and the CI type check disagree about the same file — the editor
    # flags things the `types` step never sees. Pinning it here makes both read
    # the same declarations.
    "django-stubs>=6.1.0",
    "djangorestframework-stubs>=3.18.0",
    "pre-commit",
    "pyright",
    "pytest",
    "pytest-cov>=7.1.0",
    "pytest-django",
    "ruff",
]

[tool.uv]
# Application, not a distributable library: nothing to build or install.
package = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
# Explicit: only packages routed here in [tool.uv.sources] use this index.
explicit = true

[tool.uv.sources]
# PyPI ships a CPU-only torch for Windows, which left docling's VLM pipeline running
# at >56 s/page on a machine with an idle RTX 4070. The Linux CI runner has no GPU and
# keeps the PyPI wheel, so the marker is what stops CI from pulling a CUDA build.
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]

[tool.ruff]
target-version = "py312"
line-length = 100
# Snippets in docs/ are illustrative prose, aligned for reading, not compiled code.
extend-exclude = ["*.md"]
# The check chain refuses to run outside the project venv, and that refusal has
# to parse under the system interpreter it refuses (3.10 on the dev machine). At
# py312, UP would rewrite it into syntax that fails before the check can speak.
per-file-target-version = { "scripts/**" = "py310" }

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import order
    "UP",  # modern syntax upgrades
    "B",   # bugbear
    "SIM", # simplifications
    "DJ",  # django pitfalls
    "S",   # bandit security
    "PT",  # pytest style
    "RUF", # ruff-native correctness
    "C4",  # comprehension idioms
    "TC",  # type-checking-only imports
    "N",   # pep8 naming
    "PLC", "PLE", "PLW", # pylint convention/error/warning (PLR left out: opinionated)
    "G",   # logging format strings
    "LOG", # logging misuse
]
# Lazy imports are a deliberate pattern here: docling drags torch along and costs
# seconds, so it is imported inside the functions that actually need it (see
# rag/parse.py) — a rule that forces imports to the top would undo that.
ignore = ["PLC0415"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves field annotations at class-creation time, so an import used
# only inside one is a runtime import. Without this, TC001 moves it into a
# type-checking block and the model fails to build.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
# assert is the tool in tests; the smoke tests exist to spawn subprocesses; and a
# test that logs in has to write the password down somewhere (S105) — reading it
# from the environment would only mean a credential that CI has to be given.
"tests/**" = ["S101", "S105", "S603"]
# The check chain exists to run subprocesses, from a fixed table in its own source.
"scripts/**" = ["S603"]
# Written by makemigrations, not by hand. E501: the long lines are Django's own
# help_text strings copied verbatim from the parent model, and rewrapping them
# would make the migration disagree with the model it was generated from.
# RUF012: `dependencies` and `operations` are how Django's Migration class is
# defined; annotating them ClassVar would be editing generated output.
"apps/*/migrations/*.py" = ["E501", "RUF012"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# The thesis core is plain Python with no Django metaprogramming, so it can afford
# the strictest checking; config/ and tests/ stay on standard.
strict = ["rag"]
venvPath = "."
venv = ".venv"
include = ["apps", "config", "rag", "scripts", "tests"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
# --cov deliberately not in addopts: the everyday local run stays fast and debuggable;
# CI passes it explicitly and enforces the gate below.
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
# Warnings are failures: a deprecation seen today is a break at the next `uv sync`
# upgrade. Third-party warnings get individually targeted ignores, never a blanket one.
filterwarnings = [
    "error",
    # Django warns this when it cannot open the `postgres` maintenance database
    # and falls back to the first configured one. Promoted to an error it hides
    # the actual problem: with the container down every database-backed test
    # reports a puzzle about maintenance connections instead of "connection
    # refused". Ignoring it conceals nothing — the fallback connection then
    # fails on its own terms, with the message that names the real cause.
    "ignore:Normally Django will use a connection to the 'postgres' database:RuntimeWarning",
]

[tool.coverage.run]
source = ["rag", "config", "apps"]
branch = true
# asgi/wsgi: untouched startproject entry points; nothing to measure until
# deployment (M6). golddraft: LLM-driven drafting tool whose output is
# human-gated before entering gold/ — its pure helpers are tested, but the
# drafting main() is not pipeline logic and would need a live endpoint.
# migrations: generated by makemigrations, not logic anyone wrote or can fix.
omit = [
    "config/asgi.py",
    "config/wsgi.py",
    "rag/golddraft.py",
    "apps/*/migrations/*",
]

[tool.coverage.report]
show_missing = true
# Measured 75% after the M2 test additions (the gap is parse.py's converter loop,
# which needs docling models), set ~5 points under. Ratchet up as coverage grows;
# never lower it.
fail_under = 70
