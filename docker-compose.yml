# One compose file for every environment; profiles tell the services apart.
#
# No profile => always starts. `docker compose up -d` brings up the stateful
# backing services and nothing else, which is what local development needs:
# Django and the Celery worker and beat run on the host under `uv run` so they
# can reach the GPU that rag/ requires (rag/search.py picks cuda when it is there).
#
# The tracing profile adds Langfuse, which records the LLM calls (#26):
# `docker compose --profile tracing up -d`. A profile of its own, as Dify's
# compose file keeps each optional service (outside the repository), because
# its six containers cost a few GB of memory that a session with tracing off
# has no use for.
#
# The app profile, which would containerise the whole stack on a Linux host for
# MICC and the defence demo, joins this file with that deployment (#41). Values
# come from .env, the same file config/env.py reads, so there is one place to
# change a credential.

# Fixed, so the volume names below do not depend on the checkout's directory
# name (the commands of docs/development.md name them).
name: multilingual-course-assistant

# What Langfuse's web and worker containers share, from the official compose
# file (langfuse/langfuse, docker-compose.yml, outside the repository). The
# passwords written here open services that publish no port, so no other
# machine reaches them, nor, under Docker Desktop, any process of this host; on
# a Linux host every local process reaches a container's address, so a shared
# one needs passwords of its own (#41). Langfuse's own secrets and the
# developer's account come from .env. Every value from .env defaults to empty
# rather than using `:?`, which compose checks even with the profile off: an
# empty LANGFUSE_NEXTAUTH_SECRET stops langfuse-web from starting, so the
# profile fails closed.
x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: http://localhost:3000
  DATABASE_URL: postgresql://postgres:postgres@langfuse-postgres:5432/postgres
  SALT: ${LANGFUSE_SALT:-}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
  # The loop is offline (docs/architecture.md), as Qdrant's telemetry below.
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: clickhouse
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: myredissecret

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DJANGO_DB_NAME:-mca}
      POSTGRES_USER: ${DJANGO_DB_USER:-mca}
      POSTGRES_PASSWORD: ${DJANGO_DB_PASSWORD:?set DJANGO_DB_PASSWORD in .env}
    ports:
      - "${DJANGO_DB_PORT:-5432}:5432"
    volumes:
      # A named volume, not a bind mount: PostgreSQL needs POSIX ownership and
      # fsync semantics that a Windows host directory does not give it.
      #
      # /var/lib/postgresql, not the /var/lib/postgresql/data every pre-18
      # example shows. The 18 images store data under a major-version
      # subdirectory so that `pg_upgrade --link` does not cross a mount
      # boundary, and they refuse to start when they find the old layout.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # -U and -d are not optional here: bare `pg_isready` only probes the
      # socket and reports ready while first-run initdb is still building the
      # database, so anything waiting on this condition would start too early.
      test:
        ["CMD-SHELL", "pg_isready -U ${DJANGO_DB_USER:-mca} -d ${DJANGO_DB_NAME:-mca}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    # qdrant-client 1.19.0 speaks to a server of the same major and a minor at
    # most one apart (qdrant_remote.py); pinned so the storage format moves
    # only when this line does.
    image: qdrant/qdrant:v1.19.1
    environment:
      # The loop is offline (docs/architecture.md); the server's usage
      # statistics would be its one outbound call.
      QDRANT__TELEMETRY_DISABLED: "true"
      # The image answers any origin's CORS preflight, so a web page open in
      # this host's browser could call the loopback port, deletes included.
      # Every client here is a process, and the dashboard is same-origin.
      QDRANT__SERVICE__ENABLE_CORS: "false"
    ports:
      # Loopback only: the server has no API key, and every client runs on this
      # host. A containerised app reaches it as http://qdrant:6333 instead.
      - "127.0.0.1:6333:6333" # REST, what config/env.py's QDRANT_URL names
      - "127.0.0.1:6334:6334" # gRPC
    volumes:
      # A named volume for the same reason as postgres-data above.
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image has no curl or wget (upstream qdrant/qdrant#4250), but its
      # debian:13-slim base has bash, whose /dev/tcp is enough to ask /readyz,
      # the endpoint Qdrant documents for readiness. A single node loads its
      # collections before it listens, so here it answers 200 with the port.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 10
      # Probes that fail while the server starts do not count.
      start_period: 30s
    restart: unless-stopped

  redis:
    # Celery's broker and Django's cache, each in a database of its own
    # (config/env.py says why). The major only, as postgres above.
    image: redis:8
    ports:
      # Loopback only: the server has no password, and the image turns Redis's
      # protected mode off, so a port published on every interface would be
      # open to the whole network. A containerised app reaches it as redis:6379.
      - "127.0.0.1:6379:6379"
    volumes:
      # A named volume for the same reason as postgres-data above. It holds
      # the image's default snapshots, so a restart keeps the queued tasks.
      - redis-data:/data
    healthcheck:
      # While it loads its snapshot Redis answers PING with an error rather
      # than PONG, so the reply is read, not only the exit code.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Langfuse, as its official compose file runs it (see x-langfuse-env above),
  # each backing service its own rather than ours: its migrations, its queues
  # and its data stay out of the site's database and broker, and upgrade with
  # it. The images and pins are the official file's. Only langfuse-web
  # publishes a port, on loopback as every service here: the others publish
  # none, where the official file puts them on this host's 5432 and 6379,
  # which are ours.
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    profiles: [tracing]
    depends_on: &langfuse-depends-on
      langfuse-postgres:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    environment: *langfuse-env
    restart: unless-stopped

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    profiles: [tracing]
    depends_on: *langfuse-depends-on
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
      # One account, the developer's, made below: nobody else signs up.
      AUTH_DISABLE_SIGNUP: "true"
      # Headless initialisation: the first start makes the organisation, the
      # project with the key pair the site and the rag CLIs send, and the
      # developer's account, each only if it does not exist yet.
      LANGFUSE_INIT_ORG_ID: mca
      LANGFUSE_INIT_ORG_NAME: multilingual-course-assistant
      LANGFUSE_INIT_PROJECT_ID: mca
      LANGFUSE_INIT_PROJECT_NAME: multilingual-course-assistant
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: developer
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  langfuse-clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.3.62.3
    profiles: [tracing]
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s
    restart: unless-stopped

  langfuse-minio:
    image: cgr.dev/chainguard/minio
    profiles: [tracing]
    entrypoint: sh
    # Creates the bucket the events are uploaded to, then starts the server.
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s
    restart: unless-stopped

  langfuse-redis:
    image: docker.io/redis:7
    profiles: [tracing]
    # noeviction: Langfuse's queues live here, and a job evicted under memory
    # pressure would be lost. Written out, as the official file writes it,
    # although it is Redis's own default.
    command: >
      --requirepass myredissecret
      --maxmemory-policy noeviction
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  langfuse-postgres:
    # 17, the official file's default: the pre-18 data directory below.
    image: docker.io/postgres:17
    profiles: [tracing]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  qdrant-data:
  redis-data:
  langfuse-postgres-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
  langfuse-redis-data:
