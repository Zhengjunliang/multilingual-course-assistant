# One definition, run in two places: at commit time over the staged files, and
# by the `hooks` step of scripts/check.py over every tracked file — which is
# how CI runs it too.
#
# Every rev is a commit SHA, as the action pins in ci.yml are: a tag can be
# moved, a SHA cannot. The `# frozen:` comment is the readable half, and
# Dependabot's pre-commit ecosystem moves both together.
#
# `pre-commit install` sets up both git hooks below. Every hook runs at commit
# time except commit-msg, which runs on the message; without default_stages, a
# hook that names no stage would run on the message file as well.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      # Course material and model weights must never be committed.
      # --enforce-all: by default the hook looks only at files being added,
      # so over every tracked file, as the chain runs it, it would look at none.
      # The lockfiles are generated and grow with every dependency; they are
      # not what this hook is here to stop.
      - id: check-added-large-files
        args: [--enforce-all]
        exclude: ^(uv\.lock|frontend/package-lock\.json)$
      - id: detect-private-key

  # The one place ruff runs, so a commit and CI cannot judge a file with two
  # different versions of it.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253 # frozen: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Spelling, against a list of known misspellings rather than a dictionary, so
  # Italian and Chinese mostly pass; _typos.toml says what it leaves out and why.
  # Report only, unlike upstream's default `--write-changes`: an Italian word
  # that happens to be a known English misspelling would otherwise be
  # "corrected" in place, and a fix in a quotation is a corruption.
  - repo: https://github.com/crate-ci/typos
    rev: 00f422f3b19c57bc6338715ebfe3316d38768461 # frozen: v1.50.3
    hooks:
      - id: typos
        args: [--force-exclude]

  # pyproject.toml and uv.lock must move together; CI's `uv sync --locked` would
  # catch the drift anyway, but catching it before the commit exists is cheaper.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0f4b65a503cc866b9b5e62dda2020f7943b01a65 # frozen: 0.12.22
    hooks:
      - id: uv-lock

  # The workflows' own linters, both run from pre-commit as CPython runs them:
  # zizmor for security (credentials left in .git/config, template injection,
  # unpinned actions), actionlint for what GitHub would reject or misread. Each
  # looks only at the files it understands, so a commit that leaves .github/ and
  # this file alone skips both.
  #
  # --offline: zizmor's online audits ask the GitHub API, so with a token in
  # reach it would judge the same file differently in CI than on the laptop.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # frozen: v1.30.1
    hooks:
      - id: zizmor
        args: [--no-progress, --offline]

  # Empty -shellcheck= and -pyflakes= turn off what actionlint runs on `run:`
  # scripts when it finds those tools on PATH: the runner image ships shellcheck
  # and the laptop does not, and one verdict in both places matters more.
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
        args: [-shellcheck=, -pyflakes=]

  # Rules of this repository that no off-the-shelf linter knows. The python
  # ones are guards of scripts/guards, each rule proven by the good and bad
  # examples tests/test_guards.py runs; `language: python` gives them a
  # virtualenv of their own, which is why they use the standard library only.
  - repo: local
    hooks:
      - id: env-example-parity
        name: .env.example names exactly the variables config/env.py reads
        language: python
        entry: python -m scripts.guards env-example-parity
        files: ^(\.env\.example|config/env\.py)$
        pass_filenames: false
      # The repository speaks English (CLAUDE.md, documentation conventions): prose,
      # that is; string literals are data and a multilingual project's are not.
      - id: language
        name: comments, docstrings, test names and prose are English
        language: python
        entry: python -m scripts.guards language
        types_or: [python, javascript, ts, tsx, markdown]
      # The documentation conventions of CLAUDE.md: one file at a time for
      # what one file shows, the whole repository on every commit for
      # references, which break when their target moves.
      - id: doc-conventions
        name: status markers carry evidence, no temporal words, no heading links
        language: python
        entry: python -m scripts.guards doc-conventions
        types_or: [markdown]
      - id: doc-references
        name: links, document paths, decision entries and cited paths resolve
        language: python
        entry: python -m scripts.guards doc-references
        pass_filenames: false
        always_run: true
      # Commit messages (CLAUDE.md, section 3): the message a commit is about
      # to get, and every commit already made, which catches what never met
      # the first hook. CI's hooks job fetches the whole history for it.
      - id: commit-msg
        name: the message is a Conventional Commit, in English, with no AI signature
        language: python
        entry: python -m scripts.guards commit-msg
        stages: [commit-msg]
      - id: commit-history
        name: every commit in history keeps those rules, and none is a merge
        language: python
        entry: python -m scripts.guards commit-history
        pass_filenames: false
        always_run: true
      # The frontend's linter, formatter and import order (frontend/biome.json),
      # on the staged files of the paths `npm run lint` checks, so its rules,
      # the ban on title attributes among them, hold at commit time and not
      # only in the chain. Node, as the frontend needs: the script says why it
      # runs Biome from frontend/.
      - id: biome
        name: the frontend passes Biome
        language: system
        entry: node frontend/scripts/biome-staged.mjs
        files: ^frontend/((src|e2e|scripts)/.*\.(ts|tsx|js|mjs|json|css)|(vite\.config\.ts|playwright\.config\.ts|biome\.json|package\.json|tsconfig\.json))$
      # Agent rule 6 of CLAUDE.md: one correct implementation, with the old
      # versions in git history rather than beside the file. A `v2` or later
      # counts, since it implies a `v1` beside it; a lone `v1` may be an API's.
      - id: no-parallel-versions
        name: no second version of a file next to the first
        language: fail
        entry: "a parallel version of a file; keep one, git history holds the old ones:"
        files: '(?i)(\.(old|bak|orig)$|[-_]old\.[^/]*$|[-_]v[2-9][0-9]*(\.[^/]*)?(/|$)| (- )?copy( \(?[0-9]+\)?)?(\.[^/]*)?$)'
