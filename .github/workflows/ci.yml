# No Windows job on purpose: the pytorch-cu126 marker in pyproject.toml would make a
# windows runner download a ~2.5 GB CUDA torch wheel on every run, and the full chain
# already runs on Windows daily on the dev machine (`uv run python scripts/check.py`).
name: CI

# No `paths-ignore`, and its absence is the deliberate part. A documentation
# commit does make this whole workflow run for nothing, which is a real waste
# and was filtered out until the repository went public — at which point Actions
# minutes stopped being the scarce thing they had been.
#
# What replaced that saving is worth more: a path filter is an event-level
# switch, so a filtered-out commit starts no workflow and therefore reports no
# status at all. With the chain's jobs required on main, a documentation-only pull
# request would then wait forever for a status that never arrives. Filter and
# required checks cannot both be had; this repository now has the checks.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The credentials and the database of every job that loads Django's settings,
# which refuse to load without a key and a password. Not secrets: this key only
# ever signs throwaway CI sessions, and its length is not arbitrary — `check
# --deploy` rejects anything under 50 characters. The mode (DEBUG, TLS) is not
# here: it travels with the steps of scripts/check.py.
env:
  DJANGO_SECRET_KEY: ci-only-key-never-used-outside-this-runner-and-not-a-secret
  DJANGO_DB_NAME: mca
  DJANGO_DB_USER: mca
  DJANGO_DB_PASSWORD: ci-only-password
  DJANGO_DB_HOST: localhost
  DJANGO_DB_PORT: "5432"

# The chain runs in three jobs side by side — `hooks`, `static`, `tests` — and
# each calls its steps of scripts/check.py by name; tests/test_check_script.py
# reads the three as one chain, and fails if a step of theirs runs anything
# else, goes missing, repeats or changes places. They are split by what they
# need installed, so that no step waits for another it does not depend on.
jobs:
  # The head of the chain: the hooks need neither torch nor PostgreSQL, so
  # `--only-dev` installs pre-commit and nothing heavy.
  hooks:
    runs-on: ubuntu-latest
    # Caps as in `tests` below: the job's catches a hung run, the step's is the budget.
    # This job's first cold run took 47 s; a minute above the step's cap.
    timeout-minutes: 3
    steps:
      # This job runs code fetched from the hook repositories; nothing it does
      # needs the token afterwards, so the token is not left in .git/config.
      # The whole history, because commit-history reads every commit; a
      # shallow clone makes that hook fail and say so.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          # setup-uv's cache key does not carry the job's name, so without a
          # suffix this job and the others save to one key, and whichever
          # finishes first decides what the next run restores.
          cache-suffix: hooks
          # Saved from main only. A pull request restores what its base branch
          # saved, but what it saves only that pull request can restore, and
          # each such entry held 2.65 GB: mostly prebuilt wheels, which
          # setup-uv keeps because `prune-cache` is off by default since v9. A
          # pull request that changes uv.lock restores nothing, since the key
          # carries the lockfile's hash, and it saves nothing either.
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      # The hook environments (ruff, pre-commit-hooks) are built on first use;
      # the key moves with the config that pins them and the Python they run on.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.python-version', '.pre-commit-config.yaml') }}

      # About twice a cold cache, which builds every hook environment,
      # actionlint's with Go among them: 34 s with the workflow linters, 20 s
      # before them, rounded up to minutes. Warm, its median measured 3.5 s.
      - name: Pre-commit hooks over every tracked file
        timeout-minutes: 2
        run: uv run --only-dev --locked python scripts/check.py hooks

  # The frontend's gates and its build, pyright, and the deployment checks,
  # which read the build (staticfiles.W004): what needs every package and Node,
  # but no database, since none of these steps opens one.
  static:
    runs-on: ubuntu-latest
    # About twice its median over three runs of one commit, 90 s (run
    # 40682814055), rounded up to minutes; it catches a hung run.
    timeout-minutes: 3
    steps:
      # As in `hooks`, the token is not left in .git/config: nothing here needs it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          # One key for the jobs that install everything, which `tests` saves
          # and this job only restores: each entry is about 2.65 GB, against
          # the repository's 10 GB of cache. The name is the one the entry had
          # before the chain was split, so the split started warm.
          cache-suffix: check
          save-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        run: npm ci
        working-directory: frontend

      # Every check below is a step of scripts/check.py, called by name: what
      # each one runs, in which order and why, is written there once. DEBUG off
      # and the TLS flag travel with the steps too.
      - name: Frontend lint, types, catalogues, contrast, tests and build
        run: uv run python scripts/check.py frontend

      - name: Types
        run: uv run python scripts/check.py types

      - name: System and deployment checks
        run: uv run python scripts/check.py deploy

  # pytest, the last step of the chain, beside the rest of it.
  tests:
    runs-on: ubuntu-latest
    # As `static`: about twice its median, 107 s, a guard against a hung job;
    # the budget is the cap on the tests step, which network time does not touch.
    timeout-minutes: 4
    services:
      # Migrations and the model tests need a real PostgreSQL; the version
      # tracks docker-compose.yml so CI tests what the developer runs.
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: mca
          POSTGRES_USER: mca
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mca -d mca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # As in `hooks`, the token is not left in .git/config: nothing here needs it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          # The key `static` restores, saved here and from main only, as in
          # `hooks`. No Node: no test runs it.
          cache-suffix: check
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: uv sync --locked

      # About twice its median of 82 s, rounded up to minutes: a suite that needs
      # longer has grown a regression to look at, not to wait for. The three runs
      # took 50 to 85 s, every test of the slowest about 1.7 times as long as in
      # the fastest: the runner, not the suite.
      - name: Tests
        timeout-minutes: 3
        run: uv run python scripts/check.py tests

  # The browser floors of #134: the built interface in Chromium, every `/api`
  # request answered in the browser (frontend/e2e/api.ts), so neither Python
  # nor PostgreSQL is installed. Not a step of scripts/check.py: a browser is
  # too slow for the local loop, and this job is the only place it runs.
  browser:
    runs-on: ubuntu-latest
    # About twice this job's longest run since Chromium installs without apt,
    # 100 s (tests 76 s, Chromium 5 s), rounded up to minutes.
    timeout-minutes: 4
    steps:
      # As in `hooks`, the token is not left in .git/config: nothing here needs it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        run: npm ci
        working-directory: frontend

      # The headless shell alone, the only Chromium build headless tests use.
      # No --with-deps: the runner image carries the libraries it loads, and
      # what apt would add is fonts, which no spec looks at (they read computed
      # styles, never pixels); a slow Ubuntu mirror made that apt step outlast
      # the job's cap. Vite, Vue and SvelteKit install Chromium the same way.
      # A library the image drops stops the launch with Playwright's "Host
      # system is missing dependencies", naming it. Not cached: Playwright's CI
      # guide finds restoring the browsers about as slow as downloading them.
      - name: Chromium
        run: npx playwright install --only-shell chromium
        working-directory: frontend

      - name: Browser tests
        run: npm run e2e
        working-directory: frontend

      # What a red test recorded (trace, screenshot), to open with
      # `npx playwright show-trace`; nothing is uploaded when everything passed.
      - name: Traces of the failed tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  # The journeys of #221: the built interface in Chromium against the real
  # Django and PostgreSQL, with a fake model and stub retrieval
  # (frontend/playwright.journeys.config.ts, tests/journeys/). Not a step of
  # scripts/check.py, for the reason `browser` is not.
  journeys:
    runs-on: ubuntu-latest
    # As `static`: about twice its median, 66 s (the journeys themselves 28 s),
    # a guard against a hung job.
    timeout-minutes: 3
    services:
      # As in `tests`. The journeys create a database of their own beside it,
      # `mca_journeys`, which this user may: the image makes it a superuser.
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: mca
          POSTGRES_USER: mca
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mca -d mca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # As in `hooks`, the token is not left in .git/config: nothing here needs it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          # The key `tests` saves, restored only, as in `static`.
          cache-suffix: check
          save-cache: false

      # The config starts the site with .venv's interpreter, which this creates.
      - name: Install dependencies
        run: uv sync --locked

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        run: npm ci
        working-directory: frontend

      # As in `browser`.
      - name: Chromium
        run: npx playwright install --only-shell chromium
        working-directory: frontend

      - name: Journeys
        run: npm run e2e:journeys
        working-directory: frontend

      - name: Traces of the failed journeys
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: journeys-traces
          path: frontend/test-results/
          retention-days: 7
