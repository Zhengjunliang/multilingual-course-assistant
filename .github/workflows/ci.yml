# No Windows job on purpose: the pytorch-cu126 marker in pyproject.toml would make a
# windows runner download a ~2.5 GB CUDA torch wheel on every run, and the full chain
# already runs on Windows daily on the dev machine (`uv run python scripts/check.py`).
name: CI

# No `paths-ignore`, and its absence is the deliberate part. A documentation
# commit does make this whole workflow run for nothing, which is a real waste
# and was filtered out until the repository went public — at which point Actions
# minutes stopped being the scarce thing they had been.
#
# What replaced that saving is worth more: a path filter is an event-level
# switch, so a filtered-out commit starts no workflow and therefore reports no
# status at all. With `check` and `hooks` required on main, a documentation-only pull
# request would then wait forever for a status that never arrives. Filter and
# required checks cannot both be had; this repository now has the checks.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The head of the chain, in a job of its own so that it runs beside `check`
  # rather than ahead of it: the hooks need neither torch nor PostgreSQL, so
  # `--only-dev` installs pre-commit and nothing heavy, and the path a pull
  # request waits on does not get longer.
  hooks:
    runs-on: ubuntu-latest
    # Caps as `check` below: the job's catches a hung run, the step's is the budget.
    # This job's first cold run took 47 s; a minute above the step's cap.
    timeout-minutes: 3
    steps:
      # This job runs code fetched from the hook repositories; nothing it does
      # needs the token afterwards, so the token is not left in .git/config.
      # The whole history, because commit-history reads every commit; a
      # shallow clone makes that hook fail and say so.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          # setup-uv's cache key does not carry the job's name, so without a
          # suffix this job and the others save to one key, and whichever
          # finishes first decides what the next run restores.
          cache-suffix: hooks
          # Saved from main only. A pull request restores what its base branch
          # saved, but what it saves only that pull request can restore, and
          # each such entry held 2.65 GB: mostly prebuilt wheels, which
          # setup-uv keeps because `prune-cache` is off by default since v9. A
          # pull request that changes uv.lock restores nothing, since the key
          # carries the lockfile's hash, and it saves nothing either.
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      # The hook environments (ruff, pre-commit-hooks) are built on first use;
      # the key moves with the config that pins them and the Python they run on.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.python-version', '.pre-commit-config.yaml') }}

      # A step of scripts/check.py called by name, like every step of `check`
      # below; tests/test_check_script.py reads both jobs as one chain.
      # About twice a cold cache, which builds every hook environment,
      # actionlint's with Go among them: 34 s with the workflow linters, 20 s
      # before them, rounded up to minutes. Warm, its median measured 3.5 s.
      - name: Pre-commit hooks over every tracked file
        timeout-minutes: 2
        run: uv run --only-dev --locked python scripts/check.py hooks

  check:
    runs-on: ubuntu-latest
    # About twice this job's run with a cold uv cache, 138 s, rounded up to
    # minutes; the CPU torch makes the Install step 4 s. It catches a hung run:
    # the budget is the cap on the tests step, which network time does not touch.
    timeout-minutes: 5
    env:
      # Not a secret: this key only ever signs throwaway CI sessions. Its length
      # is not arbitrary — `check --deploy` rejects anything under 50 characters.
      DJANGO_SECRET_KEY: ci-only-key-never-used-outside-this-runner-and-not-a-secret
      DJANGO_DB_NAME: mca
      DJANGO_DB_USER: mca
      DJANGO_DB_PASSWORD: ci-only-password
      DJANGO_DB_HOST: localhost
      DJANGO_DB_PORT: "5432"
    services:
      # Migrations and the model tests need a real PostgreSQL; the version
      # tracks docker-compose.yml so CI tests what the developer runs.
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: mca
          POSTGRES_USER: mca
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mca -d mca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # As in `hooks`, the token is not left in .git/config: nothing here needs it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          # A key of its own and saved from main only, as in `hooks`.
          cache-suffix: check
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: uv sync --locked

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        run: npm ci
        working-directory: frontend

      # Every check below is a step of scripts/check.py, called by name: what
      # each one runs, in which order and why, is written there once. DEBUG off
      # and the TLS flag travel with the steps too; this job sets only the
      # credentials and the database. tests/test_check_script.py fails if a
      # step of this job or of `hooks` runs anything else, goes missing,
      # repeats or changes places.
      - name: Frontend lint, types, catalogues, contrast, tests and build
        run: uv run python scripts/check.py frontend

      - name: Types
        run: uv run python scripts/check.py types

      - name: System and deployment checks
        run: uv run python scripts/check.py deploy

      # About twice its measured median of 54.5 s, rounded up to minutes: a suite
      # that needs longer has grown a regression to look at, not to wait for.
      - name: Tests
        timeout-minutes: 2
        run: uv run python scripts/check.py tests
