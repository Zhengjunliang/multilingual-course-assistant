# Its own workflow, not a third job in ci.yml, for two reasons that both come
# from what this scans rather than from how long it takes.
#
# First, ci.yml carries `paths-ignore: [docs/**, **.md]`, and a path filter is an
# event-level switch: it skips every job in the file. That is right for the
# Python and TypeScript gates, which a documentation commit cannot affect — and
# wrong for this one, because a token pasted into docs/diario-sperimentale.md or
# into a README curl example is a secret in the repository like any other. The
# commits most likely to carry one by accident are exactly the ones ci.yml skips.
#
# Second, the triggers below are load-bearing. gitleaks-action decides its scan
# range from the event: on `push` and `pull_request` it passes `--log-opts` and
# looks only at the commits that event carries, while a full-history scan happens
# only for `workflow_dispatch` and `schedule`. Without those two, this workflow
# would answer the same question pre-commit's detect-private-key already answers,
# one step later. With them, the weekly run is what answers the different
# question: whether a key was ever committed and then deleted, back when the hook
# did not exist yet.
name: Secrets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, and the day of the week carries no meaning beyond spreading load.
    - cron: "0 4 * * 1"

permissions:
  contents: read
  # Read, and only read. On a pull_request event the action asks
  # /repos/{owner}/{repo}/pulls/{n}/commits to work out which commits this event
  # carries, and without this it fails with 403 "Resource not accessible by
  # integration" — GitHub names the missing scope in the response header,
  # `x-accepted-github-permissions: pull_requests=read`. Write is a different
  # matter and stays off: it buys posting findings as pull request comments,
  # which GITLEAKS_ENABLE_COMMENTS declines below.
  pull-requests: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 for the range scans, not only for the scheduled full one:
      # on a push or a pull request the action asks git for `<base>^..<head>`,
      # and the parent of the base commit is not in a depth-1 clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE on purpose: the action bills organisation-owned
          # repositories and is free for ones owned by a user account. This
          # repository belongs to a user, so there is no key to add — and the
          # bill would arrive the day it moved into an organisation.
          #
          # Comments off so the token stays read-only. Posting a finding onto a
          # pull request needs pull-requests: write, and a token that can write
          # to pull requests is a larger change than the convenience is worth:
          # the job summary already names the file and the line.
          GITLEAKS_ENABLE_COMMENTS: false
          # Upload off, and this one is not about permissions. The artifact the
          # action uploads by default is its SARIF report, and a SARIF report of
          # a secrets scan contains the secrets it matched. Leaving it on would
          # turn every finding into a downloadable copy of itself.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
