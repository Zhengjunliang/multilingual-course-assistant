# Not a gate: Dependabot opens pull requests, CI decides whether they land. It is
# here for exactly the shape PYSEC-2026-3929 had — a fixed version sat upstream
# and nothing in this repository said so until pip-audit turned the build red.
#
# Alerts and security updates are switches in the repository settings rather
# than in this file. This file schedules version updates, but its `labels` and
# `ignore` apply to security updates as well: the packages held back below get
# an alert and a red weekly audit (workflows/dependencies.yml), never a pull
# request.
#
# Every ecosystem below carries `labels: ["dependencies"]`, the one label of the
# account's label manifest (Zhengjunliang/.github, labels/labels.json) meant for
# Dependabot. Without the key Dependabot adds, and creates when missing, a
# label per ecosystem as well, and the next label sync would delete them again.
#
# Every ecosystem also waits seven days after a release before proposing it:
# a compromised release is usually found and pulled within days, and seven is
# the floor zizmor's dependabot-cooldown audit holds this file to. The wait
# applies to version updates only; a security update opens as soon as its
# advisory does (Dependabot options reference, `cooldown`).
#
# And each groups its minor and patch updates into one pull request, named
# after the ecosystem; a major update still arrives on its own, as the one
# that may need code to change with it.
version: 2
updates:
  # `uv`, not `pip`. This project is locked with uv.lock, and the pip ecosystem
  # edits pyproject.toml without touching the lockfile — the one file that
  # `uv sync --locked` and `uv export --locked` actually read. A pip-ecosystem
  # pull request would therefore arrive already failing CI. The uv ecosystem
  # reads both, which is why it is the correct name here.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies"]
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Six packages are held back, and the reason is the same for all six: a
    # green CI does not mean they are safe here. This pipeline's CI runs no
    # ingest, touches no GPU, and mocks the LLM client away — so for anything
    # that changes how documents are parsed, how text is embedded, or how the
    # model is talked to, the build passing proves only that the code still
    # imports. What would actually prove it is re-running the ingest and
    # reproducing gold 38/40 and campus 28/32, and that is an M3 session on
    # MICC, not a routine pull request.
    #
    # This is not a security hole. An advisory on any of them turns the weekly
    # `audit` red and raises a Dependabot alert, at which point the upgrade
    # stops being routine and gets handled on its own terms, as docling's two
    # were (#158).
    #
    # Delete the entries below when the M3 re-measurement happens; that session
    # is where these belong.
    ignore:
      # Pulls docling-ibm-models across a major boundary even on a minor bump,
      # and that package is layout, TableFormer and CodeFormula — the parsing.
      - dependency-name: "docling"
      # Embedding and reranker both come through it. New vectors mean a rebuilt
      # index and every hit@k number measured again.
      - dependency-name: "sentence-transformers"
      # What the embedder loads through sentence-transformers and the reranker
      # loads directly (rag/search.py). Its fixes for PYSEC-2026-3929 and
      # PYSEC-2026-4174 came in on 5.10.1 before any re-measurement, which
      # docs/decisions.md prices; routine bumps wait for the session.
      - dependency-name: "transformers"
      # The floor the three above stand on. With torchvision below, it comes
      # from custom indexes: CI installs the Linux CPU build, the laptop a cu126
      # one, so a green CI says nothing about the machine that develops.
      - dependency-name: "torch"
      # Each release requires exactly one torch release, so an update of it
      # alone would move torch as well. The two move together, in that session.
      - dependency-name: "torchvision"
      # The OpenAI-compatible client every generation path uses. CI mocks it,
      # so CI covers exactly none of what a major bump would change.
      - dependency-name: "openai"
      # Django is held back differently — majors only, so 5.2.x security
      # patches keep arriving, which is the half that matters.
      #
      # The reason is not risk, it is that the upgrade is already refused. The
      # `django>=5.2,<6` bound in pyproject.toml is not a cautious ceiling: it
      # IS the decision written in docs/architecture.md, "Chosen stack" — LTS,
      # supported until 2028-04, with the steadiest DRF support. A Dependabot
      # pull request for Django 6 rewrites that bound to `<7`, which is to say
      # it deletes the decision, and CI would quite possibly go green on it.
      # A decision should be reversed by someone who knows they are reversing
      # it. Remove this entry the day that one is revisited on purpose.
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]

  # The SPA keeps its own lockfile in its own directory; the repository root has
  # no package.json at all, so "/" would find nothing here.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    labels: ["dependencies"]
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The hook revs in .pre-commit-config.yaml, ruff's among them: ruff is not a
  # dev dependency, so the uv ecosystem above does not see it, and this one
  # is what keeps the only pin it has from going stale.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies"]
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The action pins in ci.yml are SHAs, and a SHA says nothing about how old it
  # is — the trailing `# vN` comment is the only readable part, and it is written
  # by hand. This ecosystem is what moves both, together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies"]
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
