# Not a gate: Dependabot opens pull requests, CI decides whether they land. It is
# here for exactly the shape PYSEC-2026-3929 had — a fixed version sat upstream
# and nothing in this repository said so until pip-audit turned the build red.
#
# Alerts are a separate switch, in the repository settings rather than in this
# file. This file only schedules version updates.
version: 2
updates:
  # `uv`, not `pip`. This project is locked with uv.lock, and the pip ecosystem
  # edits pyproject.toml without touching the lockfile — the one file that
  # `uv sync --locked` and `uv export --locked` actually read. A pip-ecosystem
  # pull request would therefore arrive already failing CI. The uv ecosystem
  # reads both, which is why it is the correct name here.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Four packages are held back, and the reason is the same for all four: a
    # green CI does not mean they are safe here. This pipeline's CI runs no
    # ingest, touches no GPU, and mocks the LLM client away — so for anything
    # that changes how documents are parsed, how text is embedded, or how the
    # model is talked to, the build passing proves only that the code still
    # imports. What would actually prove it is re-running the ingest and
    # reproducing gold 38/40 and campus 28/32, and that is an M3 session on
    # MICC, not a weekly pull request.
    #
    # This is not a security hole. `pip-audit` runs on every push and will turn
    # the build red if an advisory lands on any of them, at which point the
    # upgrade stops being routine and gets handled on its own terms.
    #
    # Delete the entries below when the M3 re-measurement happens; #55 is the
    # issue that owns that moment for transformers, and the same session is
    # where these belong.
    ignore:
      # Pulls docling-ibm-models across a major boundary even on a minor bump,
      # and that package is layout, TableFormer and CodeFormula — the parsing.
      - dependency-name: "docling"
      # Embedding and reranker both come through it. New vectors mean a rebuilt
      # index and every hit@k number measured again.
      - dependency-name: "sentence-transformers"
      # The floor the two above stand on, and the one dependency with a custom
      # CUDA index: CI installs the Linux PyPI wheel, the laptop installs a
      # cu126 one, so a green CI says nothing about the machine that develops.
      - dependency-name: "torch"
      # The OpenAI-compatible client every generation path uses. CI mocks it,
      # so CI covers exactly none of what a major bump would change.
      - dependency-name: "openai"

  # The SPA keeps its own lockfile in its own directory; the repository root has
  # no package.json at all, so "/" would find nothing here.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  # The action pins in ci.yml are SHAs, and a SHA says nothing about how old it
  # is — the trailing `# vN` comment is the only readable part, and it is written
  # by hand. This ecosystem is what moves both, together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
